<!--
  "Estado de cuenta internacional" — a view the scraper does NOT support.

  "Monto Origen" writes decimals with a dot ("23.80"), and parseChileanAmount
  strips dots as thousand separators, so reading this column would record 2380
  instead of 23.80. Every extractor must decline this page: the billed resolver
  requires "Valor cuota" or "Monto Operación", neither of which exists here, and
  there is no generic "monto" fallback for exactly this reason.
-->

      <div id="m5" class="disableMonth">May</div>
      <div id="m6" class="disableMonth">Jun</div>
    </div>
  </div>
</div>
